[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmt-runtime"
version = "2026.11.12.1"
description = "The shared runtime of the llm-translators: worker processes, out-of-memory handling, the SLURM executor, request folders, the MCP server's stale-install handling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicola Ferralis", email = "ferralis@generalflash.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["llmt_runtime", "llmt_runtime.testing"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
